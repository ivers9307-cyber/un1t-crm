# EAS Workflow — manually-triggered native release.
#
# iOS gets the full pipeline (build + auto-submit to App Store
# Connect Custom App distribution). Android gets BUILD ONLY because
# UN1T's Google Workspace organisation policy
# `iam.disableServiceAccountKeyCreation` blocks creating the
# service-account JSON that `eas submit --platform android` needs.
# The Android .aab still ships automatically from this workflow —
# you just download it from the EAS build page and drag it into
# Play Console -> Internal testing -> Create new release.
#
# Both build jobs run concurrently on EAS workers — total wall-clock
# time is roughly the slower of the two (~25 min). The iOS submit
# depends only on the iOS build, so a future Android-submit failure
# (when we re-enable it) won't block iOS shipping.
#
# Trigger from https://expo.dev/accounts/<you>/projects/un1t-crm-mobile/workflows
# whenever a NATIVE change has landed on main. JS-only changes do
# NOT need this — they auto-ship via .github/workflows/eas-update.yml.
#
# Pre-flight checklist:
#   - Bump `version` in mobile/app.config.js (use `npm run version:patch`).
#     That commit touches a PUBLISH path: mobile/app.config.js is in
#     eas-update.yml's allowlist, so landing it on main publishes an OTA
#     at 10% on the CURRENT runtime lane (runtimeVersion does not move
#     with `version`). The script does not push by default — push it
#     deliberately and ramp per mobile/docs/ota-rollout.md, and not while
#     a build is in Apple review (store-release-one-app.md §8).
#   - Ensure mobile/package-lock.json is in sync with package.json
#     (the build refuses npm ci otherwise — see CLAUDE.md "Before
#     pushing").
#   - Web CI green on main.
#
# Manual-upload step for Android (post-workflow):
#   1. Open the build page on expo.dev (link surfaces in the
#      workflow output).
#   2. Download the .aab from the build artefacts panel.
#   3. Play Console -> Testing -> Internal testing -> Create new
#      release -> drag the .aab in.
#   4. Review release -> Start rollout to Internal testing.

name: Release

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      platform: ios
      profile: production
      build_id: ${{ needs.build_ios.outputs.build_id }}
