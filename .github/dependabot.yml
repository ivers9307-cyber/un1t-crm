# Dependabot — supply-chain hygiene (audit this-quarter item).
# Version updates are GROUPED + weekly to avoid PR spam; Dependabot PRs are
# reviewed, never auto-merged. They touch the lockfiles, so web PRs are gated
# by web-ci + dependency-audit.yml.
#
# NOTE: enable "Dependabot security updates" in repo Settings → Code security
# for out-of-band security bumps (that toggle is repo config, not this file).
version: 2
updates:
  # Web app (root) — the primary surface.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # DEFERRED MAJORS (2026-08-09) — both are gated on toolchain support,
      # not on work in this repo; a bare bump fails CI on arrival:
      # • tailwindcss v4: web and mobile share class strings through shared/,
      #   and NativeWind pins tailwind ^3 (see the /mobile ignore below). Web
      #   moves to v4 only together with a NativeWind release that supports
      #   it, as one deliberate task (PostCSS plugin swap + CSS-first config
      #   + renamed-utility sweep), never via a version bump PR.
      # • typescript v7 (native compiler): zero .ts files here — the package
      #   exists only as a peer of eslint-config-next → typescript-eslint,
      #   whose peer range rejects 7. Bump when typescript-eslint supports it.
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    labels: [dependencies]

  # Mobile (Expo/RN). CAUTION: EAS runs a strict `npm ci` and the app tracks a
  # specific Expo SDK — a blind transitive bump can break the native build.
  # Kept grouped + low-volume; every mobile bump MUST be reviewed against
  # Expo's expected versions before merge (never blind-merge). The planned
  # SDK jump is handled separately, not by Dependabot: SDK-coupled packages
  # (expo*, react-native*, react/react-dom, nativewind/tailwind, babel) are
  # ignored below — PR #1041 (2026-07-25) was a disguised SDK 54→57 upgrade
  # swept in by the '*' group, incl. tailwind v4 which NativeWind rejects.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      mobile-grouped:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Versions of these track the Expo SDK; they only move in the
      # isolated SDK-upgrade task (which also ships a native release).
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-*'
      # Scoped native modules the shapes above miss: HealthKit ships Swift
      # under ios/ + a config plugin, so a bump is a native change, not an
      # OTA — Dependabot PR #1566 (2026-08-31) proposed 14.0.2→14.1.0 inside
      # the routine group because '@kingstinct/…' matches no pattern.
      - dependency-name: '@kingstinct/react-native-healthkit'
      - dependency-name: '@*/react-native-*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'nativewind'
      - dependency-name: 'tailwindcss'
      - dependency-name: '@babel/core'
    labels: [dependencies, mobile]

  # Keep GitHub Actions pinned versions current (near-zero risk).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
