# STUDIO-MAC.7 — async build half of the desktop pipeline.
#
# Compiles desktop/ (Tauri 2 + Rust) on macos-latest, code-signs the
# universal .app with the Developer ID certificate, then submits it
# to Apple's notarisation service with --no-wait. The submission
# UUID + the signed (but not-yet-stapled) .app are uploaded as
# workflow artefacts.
#
# Notarisation finalisation happens in a SEPARATE workflow
# (desktop-finalize.yml) — that workflow polls Apple for the
# result, staples the ticket, packages a fresh DMG, and signs it.
#
# WHY SPLIT THE PIPELINE?
# First-time submissions on a fresh Developer ID can sit in Apple's
# notarisation queue for 30–60+ min, sometimes longer. Running the
# build and the notarisation wait in a single workflow means a
# CI run that holds a macos-latest minute for that whole window —
# expensive, slow, and brittle (any GitHub flake during the wait
# means rebuilding from scratch). Splitting them means:
#   - build returns in ~5–10 min regardless of Apple's queue depth
#   - finalisation is cheap to retry until Apple responds
#   - we can run finalisation hours or days later if needed
#
# Once a few builds have been notarised on this account Apple's
# typical wait drops to 1–5 min, but the async architecture stays —
# it's strictly safer than the synchronous variant.
#
# Triggers:
#   - push to main when anything under desktop/** changes
#   - workflow_dispatch — fire on demand from the Actions tab
#
# Pairing with finalize:
#   After this workflow succeeds, copy the run number, then open
#   the Actions tab → Desktop finalize → Run workflow → paste the
#   build run number as `build_run_id`. See desktop/SIGNING_SETUP.md.

name: Desktop build

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + submit for notarisation
    # macos-latest is Apple Silicon as of 2025. The default Rust
    # target on this runner is aarch64-apple-darwin; we add the
    # x86_64 target below so a universal binary works.
    runs-on: macos-latest
    # 30 min ceiling. The whole job (build + sign + submit-no-wait)
    # should finish in 5–10 min cold and 2–4 min with a warm cache.
    # The notarisation WAIT used to be in here and pushed the run to
    # 60–90 min on first-time Developer IDs — that's moved out to
    # the finalize workflow, which is why this can stay short.
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Stable Rust + both macOS targets so we can produce a
      # universal binary (Apple Silicon + Intel in one .app).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      # Cache Cargo registry + the desktop/src-tauri/target dir.
      # Cuts cold-build time from ~8 min to ~2 min on cache hit.
      # Cache key is invalidated when Cargo.toml changes — any
      # dependency bump invalidates and we rebuild from scratch.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install desktop npm deps
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # Build the universal-apple-darwin bundle via tauri-action.
      # This is just a thin wrapper over `tauri build` that knows
      # about the platform conventions for artefact paths.
      #
      # IMPORTANT: only APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
      # / APPLE_SIGNING_IDENTITY are passed here. The notarisation
      # trio (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID) is
      # intentionally OMITTED — when those three are present
      # tauri-action runs `xcrun notarytool submit --wait`
      # synchronously, which is exactly what this split workflow
      # exists to avoid. We submit to notarytool ourselves in the
      # next step with --no-wait.
      #
      # Setup guide for the certificate secrets: desktop/SIGNING_SETUP.md
      - name: Tauri build (universal, signed but not notarised)
        uses: tauri-apps/tauri-action@v1
        env:
          # Code-signing — base64-encoded .p12 export of the
          # Developer ID Application certificate + the export
          # password.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # The exact "Developer ID Application: <Name> (<TEAMID>)"
          # string from the certificate's Common Name. Used to pick
          # the right identity inside the temporary keychain
          # tauri-action sets up for the build.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: desktop
          args: --target universal-apple-darwin

      # Locate the signed .app, ditto-zip it (the macOS-aware
      # archive format Apple's notarytool prefers), and submit
      # asynchronously. We capture the submission UUID — the
      # finalize workflow polls Apple for the result using that
      # UUID.
      #
      # We deliberately do NOT use the DMG produced by tauri-action
      # for the artefact: it contains a non-stapled .app, so
      # shipping it as-is would be a regression vs. the stapled
      # DMG the finalize workflow produces. The build workflow's
      # only durable output is the signed .app + the UUID.
      - name: Submit .app for notarisation (async)
        id: notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_DIR="desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP_PATH=$(ls -d "$APP_DIR"/*.app | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found under $APP_DIR"
            exit 1
          fi
          echo "Found signed .app at: $APP_PATH"

          # Stage the artefacts under a known dir.
          STAGE="$RUNNER_TEMP/desktop-artefacts"
          mkdir -p "$STAGE"

          # ditto preserves macOS metadata (symlinks, code-signing
          # resources, extended attributes) where a plain `zip`
          # quietly mangles them. notarytool will reject a
          # mis-archived bundle.
          ZIP="$STAGE/repset.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          echo "Created zip for notarisation: $(ls -lh "$ZIP" | awk '{print $5}')"

          # Submit. --output-format json gives us a stable parse
          # surface; the id field is the submission UUID.
          SUBMIT_JSON="$STAGE/notarization-submit.json"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --no-wait \
            --output-format json | tee "$SUBMIT_JSON"

          UUID=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$SUBMIT_JSON")
          if [ -z "$UUID" ]; then
            echo "::error::notarytool submit returned no id"
            cat "$SUBMIT_JSON"
            exit 1
          fi

          echo "Notarisation submission UUID: $UUID"
          echo "$UUID" > "$STAGE/notarization-uuid.txt"

          # Surface it in the workflow summary so a human reviewer
          # of the run page can see the UUID without downloading
          # the artefact.
          {
            echo "## Notarisation submitted"
            echo ""
            echo "**UUID:** \`$UUID\`"
            echo ""
            echo "Run the **Desktop finalize** workflow with:"
            echo ""
            echo "    build_run_id: ${{ github.run_id }}"
            echo ""
            echo "Or, once Apple has processed the submission, check status locally with:"
            echo ""
            echo "    xcrun notarytool info $UUID --apple-id <email> --password <app-pw> --team-id <teamid>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Make the staging dir available to later steps.
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      # Upload the signed .app (zipped) + submission metadata.
      # actions/upload-artifact handles upload-side compression, but
      # the .app needs to be in a ditto archive on disk because we
      # care about preserving the signature on round-trip; just
      # uploading the directory could break Apple's code-signing
      # resource layout.
      - name: Upload signed app + notarisation metadata
        uses: actions/upload-artifact@v7
        with:
          name: repset-mac-${{ github.run_number }}-signed
          path: |
            ${{ env.STAGE }}/repset.zip
            ${{ env.STAGE }}/notarization-uuid.txt
            ${{ env.STAGE }}/notarization-submit.json
          if-no-files-found: error
          retention-days: 30
