# Mobile bundle export — PR gate (P0-4).
#
# eas-update.yml auto-publishes a JS OTA on every push to main touching
# mobile/** or shared/**. Its pre-flight runs vitest + a Babel parse +
# check:mobile-imports — but NONE of those run Metro, so a change that breaks the
# OTA *bundle* (a dep that won't bundle, a metro-config issue, an asset that
# won't resolve, an import Metro rejects) sails through PR CI and only fails — or
# worse, ships a broken bundle — at publish time. web-ci.yml's own comment admits
# this ("invisible to vitest/eslint/expo-export").
#
# This runs `expo export` — the SAME Metro bundle eas update ships — at PR time,
# so bundle-breaking changes are caught before merge. expo export is local (no
# Expo account / EXPO_TOKEN needed), so it runs on PRs fine.
#
# NOTE (the other half of P0-4 — OPERATOR action): the OTA lane is
# runtimeVersion 2.0.0 (Expo SDK 57, MOBILE-SDK57.2); installed binaries are on
# the older 1.x lanes, so OTAs reach zero devices until a 2.0.0 (SDK 57) binary
# ships. Close it with a production build + submit:
#   cd mobile && eas build -p ios --profile production --submit

name: Mobile bundle export

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/mobile-export.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/mobile-export.yml'

concurrency:
  group: mobile-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export OTA bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        # OTATREE.1 — plain `npm ci`, matching eas-update.yml and EAS Build
        # (no .npmrc anywhere in the repo). This job's whole value is that its
        # export is the same export the publish job performs; installing from a
        # different tree than the publish would make a green export prove less
        # than it appears to. See the long note in eas-update.yml's own
        # `Install dependencies` step for the measurement.
        run: npm ci

      - name: expo export (compile the OTA bundle)
        run: npx expo export --platform ios --output-dir /tmp/expo-export
