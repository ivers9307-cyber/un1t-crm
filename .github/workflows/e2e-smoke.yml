# E2E-SMOKE.1 — scheduled browser smoke against production.
#
# Read-only journeys (login → dashboard / unified inbox / invoices /
# pipeline) via Playwright; see e2e/smoke.spec.mjs. Deliberately NOT
# per-PR: it needs real credentials and a live target, and the per-PR
# pipeline (web-ci.yml) already covers tests/lint/build.
#
# Injection posture: the only user-controllable input (workflow_dispatch
# base_url) is consumed exclusively via env: assignment — never
# interpolated into a run: script.
#
# Setup (one-time, in repo Settings → Secrets and variables → Actions):
#   E2E_SMOKE_EMAIL     dedicated smoke user (see the spec header for
#                       the permissions it needs)
#   E2E_SMOKE_PASSWORD  its password
# Until both secrets exist the job exits early and green — no red
# noise, but the run log says SKIPPED loudly.

name: E2E smoke

on:
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC (08:00 Dublin summer)
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL'
        required: false
        default: 'https://crm.repset.ie'

concurrency:
  group: e2e-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        id: gate
        env:
          E2E_EMAIL: ${{ secrets.E2E_SMOKE_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_SMOKE_PASSWORD }}
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::warning::E2E smoke SKIPPED — E2E_SMOKE_EMAIL / E2E_SMOKE_PASSWORD secrets not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configured == 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install deps + Chromium
        if: steps.gate.outputs.configured == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run smoke pack
        if: steps.gate.outputs.configured == 'true'
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://crm.repset.ie' }}
          E2E_EMAIL: ${{ secrets.E2E_SMOKE_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_SMOKE_PASSWORD }}
        run: npm run test:e2e

      - name: Upload report
        if: always() && steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
