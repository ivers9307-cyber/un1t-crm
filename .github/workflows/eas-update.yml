# Auto-publish JS-only updates to EAS so the iOS app pulls them next
# time it's opened.
#
# Triggers on every push to main that touches a path which genuinely
# enters the Metro bundle (an ALLOWLIST — see the `on:` block for why),
# or shared/. Skips when only web (src/, supabase/, scripts/, CLAUDE.md)
# or non-bundle mobile files (docs, store screenshots, eas.json…)
# changed — those don't affect the bundle the iPhone is running.
#
# How a push lands on a phone:
#   1. Developer pushes to main.
#   2. This workflow runs `eas update --branch main` in the mobile/
#      directory. EAS builds a JS bundle and uploads it to Expo's
#      CDN under https://u.expo.dev/<EAS_PROJECT_ID>.
#   3. The iPhone (running Expo Go OR a custom dev build) checks for
#      updates on launch. If a newer bundle exists for the matching
#      runtime version, it downloads and applies it.
#
# Setup needed (one-time):
#   - mobile/app.config.js needs `updates.url` set (auto-filled by
#     `eas init` on first run).
#   - GitHub repo needs a secret named EXPO_TOKEN — generate one at
#     https://expo.dev/settings/access-tokens and paste into Settings
#     -> Secrets and variables -> Actions on this repo.

name: EAS Update

# Auto-publish on push is ENABLED (re-enabled 2026-06-03, after OTA was proven
# working end-to-end on v1.2.1 — a published update recovered the live binary
# from a boot-crash). Publishes to branch `main`; the `production` channel is
# mapped to `main` (`eas channel:edit`) so App Store builds receive it.
# Path-filtered to an allowlist of bundle-entering mobile paths + shared/**
# (see the `on:` block) — shared/* is imported by the mobile
# bundle, so a shared change SHOULD republish to keep web + mobile in sync.
# (The old "shared triggers could brick the app" caution was era-specific:
# back then ANY OTA boot-crashed, so more triggers = more risk. That root
# cause is fixed.)
#
# ROLLOUT PERCENTAGE — default 100 (Richard's call, 2026-08-21). This
# REVERSES the P5 staged-rollout gate. The history stays because the
# trade-off is live, not settled.
#
# What P5 decided (2026-08-17): publish at `--rollout-percentage 10`, so a
# push to main reached ~10% of same-runtime devices rather than the whole
# install base. An unstaged instant publish was fine for 16 staff phones;
# it was not judged fine for ~1,100 members on the same `main` branch /
# `production` channel.
#
# Why it was reversed: a staged rollout BLOCKS THE NEXT PUBLISH. EAS
# refuses a new update on a runtime version while a rollout is in progress
# for it — "the latest rollout percentage must be set to 100% or the
# rollout update deleted" — and nothing ramped automatically. The 10%
# publish on 2026-08-19 (TOKENDEAD.1, group 7a752860) was never ramped, so
# the next FIVE publishes all failed: BAREWRITE, LEGALENT, FUNNEL.5 and
# RETURNPIPE.1. They failed SILENTLY — this job is not a required check
# and `main` has no branch protection — so every merge reported success
# while phones received nothing for two days. A staged default that nobody
# ramps is not a safety mechanism; it is an outage that reports green.
#
# What the reversal costs, stated plainly: there is no longer a cohort
# between a bad JS bundle and the entire fleet. Runtime 2.3.0 went public
# on 2026-08-21 (build 24, Apple phased release), so a bad publish now
# reaches every 2.3.0 device on next launch. Recovery is unchanged and
# still two levers: `eas update:republish` the last good group, or
# `eas update:roll-back-to-embedded --channel production` as the hammer.
# See mobile/docs/ota-rollout.md.
#
# To stage ONE publish anyway: run this workflow via workflow_dispatch and
# set `rollout_percentage` below 100. Doing so re-arms the deadlock above,
# so ramp it to 100 before the next merge or that merge's publish fails.
#
# The pinned eas-cli 18.9.1 supports --rollout-percentage natively
# (verified against its own --help), so the Hermes-bytecode version pin is
# untouched.
#
# RESIDUAL RISK + recovery: still no preview-channel boot-gate — and, at
# the 100% default, a bad JS bundle reaches EVERY device on the runtime
# lane on next launch, not a cohort. The pipeline mitigates the
# boot-crash class (pinned `npm ci` + eas-cli so OTA Hermes bytecode matches
# the binary; an explicit runtimeVersion string so only same-lane binaries
# get it). If a bad bundle ships: halt per mobile/docs/ota-rollout.md
# (`eas update:republish` the last good group, or
# `eas update:roll-back-to-embedded --channel production` as the hammer),
# then publish a fix. See mobile/docs/OTA_BOOT_CRASH_FINDINGS.md.
on:
  # ── ALLOWLIST, not a denylist. Read this before adding a path. ────────
  #
  # This filter lists the paths that genuinely enter the Metro bundle.
  # Anything else under mobile/ is inert by default and publishes nothing.
  #
  # WHY (OTA-PATHS.1, 2026-08-19). This started as `mobile/**` with
  # negations bolted on as each new non-bundle file type was discovered.
  # That denylist failed twice in eight days:
  #   - #1451 (ddf01aef, 08-18): a docs-only push published an OTA. #1455
  #     answered it with ONE negation, `!mobile/docs/**` — the symptom.
  #   - #1434 (2ce8971c, 08-17): a push whose only mobile file was
  #     `mobile/.audit-allowlist.json` published an OTA. Still open after
  #     #1455, because the negation only covered docs. (Also settles a
  #     glob question empirically: `mobile/**` DOES match dotfiles.)
  # Still uncovered by that denylist at the time of writing:
  # asc-screenshots/, certs/, scripts/, eas.json, .eas/, .env.example.
  # Every future non-bundle file type would have re-opened it again.
  #
  # The two failure modes, and why the allowlist wins:
  #   - Denylist miss  → an UNWANTED publish. It mints a new update group
  #     at 10% on top of whatever ramp is in flight, so devices outside
  #     the new cohort keep serving the older group, and the 48h
  #     ramp-or-rollback rule in mobile/docs/ota-rollout.md now applies to
  #     a no-op. Recovery is expensive (republish the last good group).
  #   - Allowlist miss → a MISSED publish. Recovery is one `workflow_dispatch`
  #     below. Be precise about that cost: the dispatch takes no ref input,
  #     so it republishes from whatever is on main HEAD at that moment (not
  #     the missed commit — it ships everything else that landed since).
  #     At the 100% default it lands on the whole runtime lane immediately.
  # It is still the cheaper miss — a publish you chose beats republishing a
  # last-good group to undo one you didn't — but it is not free.
  #
  # Loudness is the tiebreak. A denylist miss is loud but expensive; an
  # allowlist miss is silent but cheaper — and its silence is SURFACED by
  # `npm run check:ota-paths`, which fails the moment a new top-level entry
  # under mobile/ is classified as neither bundle nor non-bundle. Surfaced,
  # not prevented: `main` has NO branch protection and no rulesets (checked
  # 2026-08-19), so a red Web CI blocks no merge and a direct-to-main push
  # skips PR checks entirely. What makes it bite is the inline gate in this
  # workflow's own job below, which runs the same check and ABORTS the
  # publish. Until main gets branch protection with `Test & lint` required,
  # the PR-side run is a signal and the inline run is the gate.
  #
  # Either way the allowlist's failure is caught by the person with the
  # context to classify it, while the denylist's failure can only ever be
  # caught in production. There is no equivalent guard possible for a
  # denylist: detecting "someone added a new non-bundle path" requires
  # exactly the same classification list, and once you have that list the
  # allowlist is strictly safer, because an UNCLASSIFIED path defaults to
  # "don't publish" instead of "publish".
  #
  # ADDING A PATH: if it changes the JS/assets Metro emits, add it here
  # AND to scripts/check-ota-trigger-paths.mjs. If it doesn't, add it to
  # that script's NON_BUNDLE map with a reason. The guard forces the choice.
  #
  # NOTE: `!mobile/docs/**` is GONE, not reverted — under an allowlist it
  # is redundant (mobile/docs/** matches no positive pattern, so it never
  # fires), and keeping a stray negation would invite the next person to
  # "just add one more" and slide back to a denylist. #1455's behaviour is
  # preserved and is regression-tested in tests/ota-trigger-paths.test.js.
  #
  # NOTE: this workflow file is deliberately NOT in its own trigger
  # (mobile-export.yml lists itself, but that one only verifies). Editing
  # the publish pipeline must not publish.
  push:
    branches: [main]
    paths:
      # Source that Metro walks from the `main` entry point (index.js).
      - 'mobile/app/**'
      - 'mobile/components/**'
      - 'mobile/lib/**'
      # Bundled assets: the Archivo fonts are require()d from
      # app/_layout.jsx:177-179, so Metro ships them in the update.
      #
      # ACCEPTED OVER-TRIGGER, stated plainly because it is the one live
      # instance of the failure this PR exists to kill. mobile/assets holds
      # 8 tracked files: 3 fonts + a licence, and 4 PNGs — icon.png,
      # splash.png, adaptive-icon.png, notification-icon.png. The PNGs are
      # referenced ONLY from mobile/app.config.js:123,136,201,222 (config-
      # plugin / native-build inputs); no require() or import of them exists
      # anywhere under mobile/app|lib|components or shared/. So an icon or
      # splash swap produces a byte-identical JS bundle and still mints a
      # fresh update group at 10% on the live runtime lane.
      #
      # Kept wholesale anyway: narrowing to `mobile/assets/fonts/**` would
      # strand any future require()d image under mobile/assets/, and this
      # guard classifies at top-level-entry granularity — with only
      # `fonts/**` listed, its `mobile/assets/__probe__` probe stops
      # matching and `assets` reports UNCLASSIFIED. A missed font beats a
      # no-op publish. Narrow it only after the guard learns sub-entry
      # granularity AND an import-graph reachability assertion exists.
      # Until then: swap store art in the same push as real code, or do it
      # deliberately and ramp. See mobile/docs/store-release-one-app.md §4.
      - 'mobile/assets/**'
      - 'mobile/index.js'
      # Config that changes what Metro emits: expo config + runtimeVersion,
      # the Babel transform, the resolver, and the NativeWind stylesheet.
      - 'mobile/app.config.js'
      - 'mobile/babel.config.js'
      - 'mobile/metro.config.js'
      - 'mobile/tailwind.config.js'
      - 'mobile/global.css'
      # The dependency tree IS bundle content, and `npm ci` is
      # lockfile-exact — the lock is load-bearing for Hermes bytecode ABI.
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      # shared/ stays WHOLESALE on purpose. Mobile imports 48 of the 119
      # modules today via the `shared` package seam, but that is a static
      # count of DIRECT imports — it misses shared→shared transitive
      # pulls, and the set churns every week. A missed OTA for a real
      # shared change is worse than an occasional extra publish for a
      # web-only module, so this one deliberately over-triggers.
      - 'shared/**'
  # Manual re-publish on demand stays available. This is also the recovery
  # path if the allowlist above ever misses a genuinely-bundled file — but
  # it takes no ref input, so it publishes from main HEAD (not the missed
  # commit). See mobile/docs/ota-rollout.md.
  #
  # `rollout_percentage` is the ONE knob: default 100 (whole runtime lane).
  # Set it lower to stage a risky publish — and read the header comment
  # first, because a partial rollout blocks the NEXT publish until someone
  # ramps it to 100.
  workflow_dispatch:
    inputs:
      rollout_percentage:
        description: 'Rollout % for this publish (1-100). 100 = whole runtime lane. Below 100 blocks the next publish until ramped.'
        required: false
        default: '100'

# Cancel any in-flight update if a newer push lands while this is
# running — only the latest commit's bundle should ever be live.
concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

# Run the marketplace actions (currently pinned to Node 20) on Node 24 —
# GitHub's documented opt-in ahead of the 2026-06-16 forced cutover.
# Lower-risk than a major-version bump of each action on a pipeline we
# just got working.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    name: Publish update
    runs-on: ubuntu-latest
    # Job-level, not step-level: the publish step passes it to the CLI and
    # the summary step reports it. `inputs` is empty on a `push` event, so
    # the `|| '100'` fallback is what makes 100 the default for a merge.
    env:
      ROLLOUT_PCT: ${{ inputs.rollout_percentage || '100' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v9
        with:
          # Pinned (was `latest`). The OTA toolchain must be deterministic and
          # match the version that builds the binary (eas.json cli.version).
          eas-version: 18.9.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        # `npm ci` (lockfile-exact), NOT `npm install`. `eas build` installs the
        # binary's deps with `npm ci`; the OTA bundle must use the SAME tree so
        # its Hermes bytecode is ABI-compatible with the engine in the binary.
        # `npm install` can resolve a newer tree → mismatched bytecode → the
        # 2026-06-03 boot-crash. `--legacy-peer-deps` preserves the prior peer
        # resolution (there is no .npmrc in the repo).
        run: npm ci --legacy-peer-deps

      # Pre-flight syntax check on every JSX/JS file. ~5 sec. Catches
      # the most damaging class of bug — a broken bundle being pushed
      # to every staff member's phone — before we spend a minute
      # uploading it to Expo's CDN. Falls through if all files parse,
      # exits non-zero if anything is broken (which fails the job and
      # skips the publish step below).
      #
      # Script lives INSIDE mobile/ (not /tmp) so Node's module
      # resolver walks up into mobile/node_modules and finds
      # @babel/parser. Running it from /tmp/ would fail with
      # 'Cannot find module @babel/parser' even though the package
      # is installed.
      - name: Babel parse mobile JS/JSX
        run: |
          cat > parse-check.mjs << 'EOF'
          import { readFileSync, readdirSync, statSync } from 'node:fs'
          import { join } from 'node:path'
          import { parse } from '@babel/parser'

          function walk(dir, out = []) {
            for (const e of readdirSync(dir)) {
              if (e === 'node_modules' || e.startsWith('.')) continue
              const p = join(dir, e)
              if (statSync(p).isDirectory()) walk(p, out)
              else if (/\.(jsx?|mjs|cjs)$/.test(e)) out.push(p)
            }
            return out
          }

          // Walk every conventional source dir. Add new dirs to this
          // list when you create them (e.g. mobile/hooks/, mobile/utils/).
          const SOURCE_DIRS = ['app', 'lib', 'components']
          const files = [
            ...SOURCE_DIRS.flatMap(d => {
              try { return walk(d) } catch { return [] }
            }),
            'app.config.js',
            'babel.config.js',
            'metro.config.js',
            'tailwind.config.js',
          ]

          let bad = 0
          for (const f of files) {
            try {
              parse(readFileSync(f, 'utf8'), {
                sourceType: 'module',
                plugins: ['jsx'],
              })
            } catch (e) {
              console.error(`FAIL  ${f}`)
              console.error(`      ${e.message}`)
              bad++
            }
          }
          console.log(`Checked ${files.length} files, ${bad} failed.`)
          process.exit(bad > 0 ? 1 : 0)
          EOF
          node parse-check.mjs
          rm -f parse-check.mjs

      # ── Full CI mirror before anything ships to production phones ──
      # (AUDIT-JUN10.3) The Babel parse above only proves the files
      # PARSE — the 2026-06 schedule crash shipped a bundle that parsed
      # fine but imported a name its target module didn't export. Web CI
      # runs these gates on PRs, but on a main push it's a PARALLEL
      # workflow: a red Web CI has never blocked this publish, and a
      # direct-to-main push skips PR checks entirely. Running the gates
      # inline closes both holes: vitest (includes mobile/lib tests),
      # mobile-import resolution (the guard built for exactly that
      # crash class), and web↔mobile permission parity.
      - name: Install root dependencies (for CI-mirror gates)
        working-directory: .
        run: npm ci --legacy-peer-deps

      # check:ota-paths is here, and not only in web-ci, because web-ci is a
      # PARALLEL workflow on a main push — a red one has never blocked this
      # publish — and `main` has no branch protection, so its PR-side run
      # gates nothing either. Run inline it becomes a real gate: an
      # unclassified top-level entry under mobile/ ABORTS the publish
      # instead of merely annotating a PR. It is pure Node against the
      # checked-out tree (no network, no install cost beyond the npm ci
      # above). `npm test` already runs tests/ota-trigger-paths.test.js, so
      # a trigger edit that breaks the fires/does-not-fire table also
      # aborted before this — the tree-walk half was the part missing.
      - name: Gate — vitest + mobile-imports + mobile-parity + ota-paths
        working-directory: .
        run: |
          npm test
          npm run check:mobile-imports
          npm run check:mobile-parity
          npm run check:ota-paths

      # NOTE (MOBILE-AUDIT.2): a signed-publish step lived here briefly
      # (#446) and was reverted — EAS Update code signing is Enterprise-
      # plan-only and Expo's server rejects signed publishes on Starter
      # (live failure 2026-06-11). Re-add the "materialise key +
      # --private-key-path" wiring ONLY after upgrading the Expo plan;
      # the key material is retained (EXPO_UPDATES_PRIVATE_KEY secret +
      # mobile/keys/). See mobile/docs/eas-update-code-signing.md.
      #
      # Use the commit message as the EAS update note so you can see
      # at a glance which commit a given update came from in the EAS
      # dashboard. Squash newlines to keep the eas-update CLI happy.
      #
      # --rollout-percentage: 100 by default (see the header comment for why
      # the P5 10% gate was reversed on 2026-08-21). A workflow_dispatch run
      # may lower it to stage one publish; anything below 100 leaves a
      # rollout in progress that BLOCKS the next publish until ramped, so
      # halt/ramp procedure still matters: mobile/docs/ota-rollout.md.
      # Supported by the pinned eas-cli 18.9.1; do NOT bump the pin to change
      # rollout behaviour — the pin exists for Hermes bytecode compatibility
      # with the binary.
      #
      # Read through an env var, not inlined into the script: a
      # workflow_dispatch input is attacker-influenced in principle and must
      # never be interpolated straight into a shell command. The range guard
      # rejects a fat-fingered 0 or 1000 before the CLI sees it (it cannot
      # catch a 10 that meant 100 — nothing can).
      #
      # --json so the next step can put the published group id +
      # runtimeVersion in the job summary (non-JSON chatter goes to
      # stderr, so stdout is clean JSON; it also implies
      # --non-interactive, which we keep explicit for clarity).
      - name: Publish update
        run: |
          case "$ROLLOUT_PCT" in
            ''|*[!0-9]*)
              echo "rollout_percentage must be an integer 1-100, got '$ROLLOUT_PCT'" >&2
              exit 1 ;;
          esac
          if [ "$ROLLOUT_PCT" -lt 1 ] || [ "$ROLLOUT_PCT" -gt 100 ]; then
            echo "rollout_percentage must be 1-100, got '$ROLLOUT_PCT'" >&2
            exit 1
          fi
          MSG=$(git log -1 --pretty=%s)
          # At 100, OMIT the flag rather than passing `--rollout-percentage
          # 100`. A plain publish creates no rollout object at all — the
          # pre-P5 behaviour that ran for months. Passing 100 explicitly
          # ought to be equivalent, but "a rollout that happens to sit at
          # 100%" is precisely the object whose existence blocked five
          # publishes in Aug 2026. Don't mint one to make a point.
          if [ "$ROLLOUT_PCT" -eq 100 ]; then
            set -- --branch main --message "$MSG" --non-interactive --json
          else
            set -- --branch main --message "$MSG" \
              --rollout-percentage "$ROLLOUT_PCT" --non-interactive --json
          fi
          eas update "$@" > eas-update-result.json
          cat eas-update-result.json

      # Surface what actually shipped: runtime lane (which binaries will
      # take this update) + rollout % + the group id you need if you ever
      # have to ramp or republish (`eas update:edit <group>
      # --rollout-percentage N`, `eas update:republish --group <id>`).
      # The estate keeps re-learning these by clicking through the EAS
      # dashboard — put them where the eyes already are. Defensive: a
      # summary hiccup must never fail a job whose publish succeeded.
      - name: Job summary — published update
        if: success()
        run: |
          node -e '
            let updates = []
            try { updates = JSON.parse(require("fs").readFileSync("eas-update-result.json", "utf8")) } catch {}
            if (!Array.isArray(updates)) updates = [updates].filter(Boolean)
            const uniq = (k) => [...new Set(updates.map((u) => u && u[k]).filter(Boolean))]
            const groups = uniq("group")
            const runtimes = uniq("runtimeVersion")
            const rollout = uniq("rolloutPercentage")
            const lines = [
              "## EAS OTA published",
              "",
              `- **Runtime version (lane):** ${runtimes.join(", ") || "unknown — check the EAS dashboard"}`,
              `- **Rollout:** ${rollout.length ? rollout.join(", ") + "%" : (process.env.ROLLOUT_PCT || "100") + "% (as requested; CLI output omitted the field)"}`,
              `- **Update group:** ${groups.join(", ") || "unknown — `eas update:list --branch main`"}`,
              `- **Platforms:** ${uniq("platform").join(", ") || "unknown"}`,
              "",
              Number(process.env.ROLLOUT_PCT || 100) < 100
                ? "PARTIAL rollout — ramp to 100% or roll back within 48h, or the NEXT publish will fail. Runbook: `mobile/docs/ota-rollout.md`."
                : "Full rollout — every device on this runtime lane takes it on next launch. Halt runbook: `mobile/docs/ota-rollout.md`.",
            ]
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n")
          ' || echo "Job summary generation failed (non-fatal)"
