# Auto-publish JS-only updates to EAS so the iOS app pulls them next
# time it's opened.
#
# Triggers on every push to main that touches mobile/ or shared/.
# Skips when only web (src/, supabase/, scripts/, CLAUDE.md, etc.)
# changed — those don't affect the bundle the iPhone is running.
#
# How a push lands on a phone:
#   1. Developer pushes to main.
#   2. This workflow runs `eas update --branch main` in the mobile/
#      directory. EAS builds a JS bundle and uploads it to Expo's
#      CDN under https://u.expo.dev/<EAS_PROJECT_ID>.
#   3. The iPhone (running Expo Go OR a custom dev build) checks for
#      updates on launch. If a newer bundle exists for the matching
#      runtime version, it downloads and applies it.
#
# Setup needed (one-time):
#   - mobile/app.config.js needs `updates.url` set (auto-filled by
#     `eas init` on first run).
#   - GitHub repo needs a secret named EXPO_TOKEN — generate one at
#     https://expo.dev/settings/access-tokens and paste into Settings
#     -> Secrets and variables -> Actions on this repo.

name: EAS Update

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/eas-update.yml'

# Cancel any in-flight update if a newer push lands while this is
# running — only the latest commit's bundle should ever be live.
concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Pre-flight syntax check on every JSX/JS file. ~5 sec. Catches
      # the most damaging class of bug — a broken bundle being pushed
      # to every staff member's phone — before we spend a minute
      # uploading it to Expo's CDN. Falls through if all files parse,
      # exits non-zero if anything is broken (which fails the job and
      # skips the publish step below).
      #
      # Script lives INSIDE mobile/ (not /tmp) so Node's module
      # resolver walks up into mobile/node_modules and finds
      # @babel/parser. Running it from /tmp/ would fail with
      # 'Cannot find module @babel/parser' even though the package
      # is installed.
      - name: Babel parse mobile JS/JSX
        run: |
          cat > parse-check.mjs << 'EOF'
          import { readFileSync, readdirSync, statSync } from 'node:fs'
          import { join } from 'node:path'
          import { parse } from '@babel/parser'

          function walk(dir, out = []) {
            for (const e of readdirSync(dir)) {
              if (e === 'node_modules' || e.startsWith('.')) continue
              const p = join(dir, e)
              if (statSync(p).isDirectory()) walk(p, out)
              else if (/\.(jsx?|mjs|cjs)$/.test(e)) out.push(p)
            }
            return out
          }

          const files = [
            ...walk('app'),
            ...walk('lib'),
            'app.config.js',
            'babel.config.js',
            'metro.config.js',
            'tailwind.config.js',
          ]

          let bad = 0
          for (const f of files) {
            try {
              parse(readFileSync(f, 'utf8'), {
                sourceType: 'module',
                plugins: ['jsx'],
              })
            } catch (e) {
              console.error(`FAIL  ${f}`)
              console.error(`      ${e.message}`)
              bad++
            }
          }
          console.log(`Checked ${files.length} files, ${bad} failed.`)
          process.exit(bad > 0 ? 1 : 0)
          EOF
          node parse-check.mjs
          rm -f parse-check.mjs

      # Use the commit message as the EAS update note so you can see
      # at a glance which commit a given update came from in the EAS
      # dashboard. Squash newlines to keep the eas-update CLI happy.
      - name: Publish update
        run: |
          MSG=$(git log -1 --pretty=%s)
          eas update \
            --branch main \
            --message "$MSG" \
            --non-interactive
