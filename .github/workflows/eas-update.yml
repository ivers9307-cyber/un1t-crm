# Auto-publish JS-only updates to EAS so the iOS app pulls them next
# time it's opened.
#
# Triggers on every push to main that touches mobile/ or shared/.
# Skips when only web (src/, supabase/, scripts/, CLAUDE.md, etc.)
# changed — those don't affect the bundle the iPhone is running.
#
# How a push lands on a phone:
#   1. Developer pushes to main.
#   2. This workflow runs `eas update --branch main` in the mobile/
#      directory. EAS builds a JS bundle and uploads it to Expo's
#      CDN under https://u.expo.dev/<EAS_PROJECT_ID>.
#   3. The iPhone (running Expo Go OR a custom dev build) checks for
#      updates on launch. If a newer bundle exists for the matching
#      runtime version, it downloads and applies it.
#
# Setup needed (one-time):
#   - mobile/app.config.js needs `updates.url` set (auto-filled by
#     `eas init` on first run).
#   - GitHub repo needs a secret named EXPO_TOKEN — generate one at
#     https://expo.dev/settings/access-tokens and paste into Settings
#     -> Secrets and variables -> Actions on this repo.

name: EAS Update

# Auto-publish on push is ENABLED (re-enabled 2026-06-03, after OTA was proven
# working end-to-end on v1.2.1 — a published update recovered the live binary
# from a boot-crash). Publishes to branch `main`; the `production` channel is
# mapped to `main` (`eas channel:edit`) so App Store builds receive it.
# Path-filtered to mobile/** + shared/** — shared/* is imported by the mobile
# bundle, so a shared change SHOULD republish to keep web + mobile in sync.
# (The old "shared triggers could brick the app" caution was era-specific:
# back then ANY OTA boot-crashed, so more triggers = more risk. That root
# cause is fixed.)
#
# STAGED ROLLOUT (P5 exit gate, Repset merge — decided 2026-08-17): the
# publish below carries `--rollout-percentage 10`, so a push to main reaches
# ~10% of same-runtime devices, not the whole install base. This was the
# Phase-5 precondition for the public App Store release: an unstaged instant
# publish was acceptable for 16 staff, not for ~1,100 members on the same
# `main` branch / `production` channel. Ramping to 100% (and halting a bad
# rollout) is a MANUAL step — the full runbook is mobile/docs/ota-rollout.md.
# Rule: every rollout is ramped to 100 or rolled back within 48h; no zombie
# partials. The pinned eas-cli 18.9.1 supports --rollout-percentage natively
# (verified against its own --help), so the Hermes-bytecode version pin is
# untouched.
#
# RESIDUAL RISK + recovery: still no preview-channel boot-gate — a bad JS
# bundle reaches the 10% cohort on next launch. The pipeline mitigates the
# boot-crash class (pinned `npm ci` + eas-cli so OTA Hermes bytecode matches
# the binary; an explicit runtimeVersion string so only same-lane binaries
# get it). If a bad bundle ships: halt per mobile/docs/ota-rollout.md
# (`eas update:republish` the last good group, or
# `eas update:roll-back-to-embedded --channel production` as the hammer),
# then publish a fix. See mobile/docs/OTA_BOOT_CRASH_FINDINGS.md.
on:
  # Auto-publish a JS OTA when mobile/ or shared/ code lands on main.
  # Path-filtered so web-only pushes (src/, supabase/, docs, CLAUDE.md)
  # don't trigger a needless publish. PRs run web CI first, so by the
  # time a change is on main it's already been checked.
  # mobile/docs/** is excluded: runbooks aren't bundled, but a publish
  # from a docs-only push would still mint a new update group (metro
  # hash churn) and stack a fresh 10% rollout on top of whatever ramp
  # is in flight.
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/docs/**'
      - 'shared/**'
  # Manual re-publish on demand stays available.
  workflow_dispatch: {}

# Cancel any in-flight update if a newer push lands while this is
# running — only the latest commit's bundle should ever be live.
concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

# Run the marketplace actions (currently pinned to Node 20) on Node 24 —
# GitHub's documented opt-in ahead of the 2026-06-16 forced cutover.
# Lower-risk than a major-version bump of each action on a pipeline we
# just got working.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    name: Publish update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v9
        with:
          # Pinned (was `latest`). The OTA toolchain must be deterministic and
          # match the version that builds the binary (eas.json cli.version).
          eas-version: 18.9.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        # `npm ci` (lockfile-exact), NOT `npm install`. `eas build` installs the
        # binary's deps with `npm ci`; the OTA bundle must use the SAME tree so
        # its Hermes bytecode is ABI-compatible with the engine in the binary.
        # `npm install` can resolve a newer tree → mismatched bytecode → the
        # 2026-06-03 boot-crash. `--legacy-peer-deps` preserves the prior peer
        # resolution (there is no .npmrc in the repo).
        run: npm ci --legacy-peer-deps

      # Pre-flight syntax check on every JSX/JS file. ~5 sec. Catches
      # the most damaging class of bug — a broken bundle being pushed
      # to every staff member's phone — before we spend a minute
      # uploading it to Expo's CDN. Falls through if all files parse,
      # exits non-zero if anything is broken (which fails the job and
      # skips the publish step below).
      #
      # Script lives INSIDE mobile/ (not /tmp) so Node's module
      # resolver walks up into mobile/node_modules and finds
      # @babel/parser. Running it from /tmp/ would fail with
      # 'Cannot find module @babel/parser' even though the package
      # is installed.
      - name: Babel parse mobile JS/JSX
        run: |
          cat > parse-check.mjs << 'EOF'
          import { readFileSync, readdirSync, statSync } from 'node:fs'
          import { join } from 'node:path'
          import { parse } from '@babel/parser'

          function walk(dir, out = []) {
            for (const e of readdirSync(dir)) {
              if (e === 'node_modules' || e.startsWith('.')) continue
              const p = join(dir, e)
              if (statSync(p).isDirectory()) walk(p, out)
              else if (/\.(jsx?|mjs|cjs)$/.test(e)) out.push(p)
            }
            return out
          }

          // Walk every conventional source dir. Add new dirs to this
          // list when you create them (e.g. mobile/hooks/, mobile/utils/).
          const SOURCE_DIRS = ['app', 'lib', 'components']
          const files = [
            ...SOURCE_DIRS.flatMap(d => {
              try { return walk(d) } catch { return [] }
            }),
            'app.config.js',
            'babel.config.js',
            'metro.config.js',
            'tailwind.config.js',
          ]

          let bad = 0
          for (const f of files) {
            try {
              parse(readFileSync(f, 'utf8'), {
                sourceType: 'module',
                plugins: ['jsx'],
              })
            } catch (e) {
              console.error(`FAIL  ${f}`)
              console.error(`      ${e.message}`)
              bad++
            }
          }
          console.log(`Checked ${files.length} files, ${bad} failed.`)
          process.exit(bad > 0 ? 1 : 0)
          EOF
          node parse-check.mjs
          rm -f parse-check.mjs

      # ── Full CI mirror before anything ships to production phones ──
      # (AUDIT-JUN10.3) The Babel parse above only proves the files
      # PARSE — the 2026-06 schedule crash shipped a bundle that parsed
      # fine but imported a name its target module didn't export. Web CI
      # runs these gates on PRs, but on a main push it's a PARALLEL
      # workflow: a red Web CI has never blocked this publish, and a
      # direct-to-main push skips PR checks entirely. Running the gates
      # inline closes both holes: vitest (includes mobile/lib tests),
      # mobile-import resolution (the guard built for exactly that
      # crash class), and web↔mobile permission parity.
      - name: Install root dependencies (for CI-mirror gates)
        working-directory: .
        run: npm ci --legacy-peer-deps

      - name: Gate — vitest + mobile-imports + mobile-parity
        working-directory: .
        run: |
          npm test
          npm run check:mobile-imports
          npm run check:mobile-parity

      # NOTE (MOBILE-AUDIT.2): a signed-publish step lived here briefly
      # (#446) and was reverted — EAS Update code signing is Enterprise-
      # plan-only and Expo's server rejects signed publishes on Starter
      # (live failure 2026-06-11). Re-add the "materialise key +
      # --private-key-path" wiring ONLY after upgrading the Expo plan;
      # the key material is retained (EXPO_UPDATES_PRIVATE_KEY secret +
      # mobile/keys/). See mobile/docs/eas-update-code-signing.md.
      #
      # Use the commit message as the EAS update note so you can see
      # at a glance which commit a given update came from in the EAS
      # dashboard. Squash newlines to keep the eas-update CLI happy.
      #
      # --rollout-percentage 10: STAGED rollout (P5 exit gate — see the
      # header comment). Devices outside the 10% keep serving the previous
      # latest update on the branch. Ramp/halt is manual:
      # mobile/docs/ota-rollout.md. Supported by the pinned eas-cli 18.9.1;
      # do NOT bump the pin to change rollout behaviour — the pin exists
      # for Hermes bytecode compatibility with the binary.
      #
      # --json so the next step can put the published group id +
      # runtimeVersion in the job summary (non-JSON chatter goes to
      # stderr, so stdout is clean JSON; it also implies
      # --non-interactive, which we keep explicit for clarity).
      - name: Publish update
        run: |
          MSG=$(git log -1 --pretty=%s)
          eas update \
            --branch main \
            --message "$MSG" \
            --rollout-percentage 10 \
            --non-interactive \
            --json > eas-update-result.json
          cat eas-update-result.json

      # Surface what actually shipped: runtime lane (which binaries will
      # take this update) + rollout % + the group id you need for the
      # manual ramp (`eas update:edit <group> --rollout-percentage N`).
      # The estate keeps re-learning these by clicking through the EAS
      # dashboard — put them where the eyes already are. Defensive: a
      # summary hiccup must never fail a job whose publish succeeded.
      - name: Job summary — published update
        if: success()
        run: |
          node -e '
            let updates = []
            try { updates = JSON.parse(require("fs").readFileSync("eas-update-result.json", "utf8")) } catch {}
            if (!Array.isArray(updates)) updates = [updates].filter(Boolean)
            const uniq = (k) => [...new Set(updates.map((u) => u && u[k]).filter(Boolean))]
            const groups = uniq("group")
            const runtimes = uniq("runtimeVersion")
            const rollout = uniq("rolloutPercentage")
            const lines = [
              "## EAS OTA published (staged rollout)",
              "",
              `- **Runtime version (lane):** ${runtimes.join(", ") || "unknown — check the EAS dashboard"}`,
              `- **Rollout:** ${rollout.length ? rollout.join(", ") + "%" : "10% (as requested; CLI output omitted the field)"}`,
              `- **Update group:** ${groups.join(", ") || "unknown — `eas update:list --branch main`"}`,
              `- **Platforms:** ${uniq("platform").join(", ") || "unknown"}`,
              "",
              "Ramp to 100% or roll back within 48h — runbook: `mobile/docs/ota-rollout.md`.",
            ]
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n")
          ' || echo "Job summary generation failed (non-fatal)"
