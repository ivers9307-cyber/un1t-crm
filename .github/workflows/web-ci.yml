# Web CI — runs vitest + ESLint on every push to main that touches
# web code. Catches the class of bug where an import gets removed
# but a reference to it stays in the file (the 'estimatedProfit is
# not defined' runtime error that took out /cars/[id]).
#
# Mirror of eas-update.yml on the mobile side: same mtime trigger,
# same fail-fast philosophy. (Next 16 removed `next lint` — plain
# `eslint .` here is the only lint gate.) Failing in GitHub Actions
# surfaces breakage early, before a broken bundle reaches the queue.

name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'mobile/**'
      # tests/** holds the top-level vitest suites (cross-tenant
      # harness, guardrails, agent evals) — npm test already collects
      # them via vitest.config.js; watching the dir makes a tests-only
      # change re-run CI too (SAAS-10).
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.eslintrc.json'
      - 'eslint.config.mjs'
      - 'eslint.mobile-imports.config.mjs'
      - 'eslint.mobile.config.mjs'
      - 'eslint.guardrails.config.mjs'
      - 'eslint-rules/**'
      - 'vitest.config.js'
      - 'jsconfig.json'
      # scripts/** added because scripts/check-mobile-parity.mjs is
      # one of the CI steps — editing that script needs to re-run CI
      # to verify the change. Otherwise a parity-rule fix lands silently
      # without CI confirming it works (which happened on commit
      # a1e57a8 — the attendance_reports allow-list addition didn't
      # trigger CI because scripts/** wasn't watched).
      - 'scripts/**'
      # check-location-scoping derives its tenant-table set from the
      # migrations — a migration adding location_id to a table must re-run
      # CI so newly-tenanted tables get their routes checked.
      - 'supabase/migrations/**'
      - '.github/workflows/web-ci.yml'
      # OTA-PATHS.1 — check:ota-paths validates eas-update.yml's publish
      # trigger. Without watching that file, editing the trigger would
      # skip the only check that inspects it.
      - '.github/workflows/eas-update.yml'
  # Also run on every PR targeting main — without this, branches
  # were never CI-checked and we only found out about failures after
  # a merge. Discovered May 2026 after every Web CI run on main had
  # been failing for 8 consecutive merges (a missing `typescript`
  # devDep that eslint-config-next transitively required).
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'mobile/**'
      - 'tests/**' # see push paths note (SAAS-10)
      - 'package.json'
      - 'package-lock.json'
      - '.eslintrc.json'
      - 'eslint.config.mjs'
      - 'eslint.mobile-imports.config.mjs'
      - 'eslint.mobile.config.mjs'
      - 'eslint.guardrails.config.mjs'
      - 'eslint-rules/**'
      - 'vitest.config.js'
      - 'jsconfig.json'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - '.github/workflows/web-ci.yml'
      - '.github/workflows/eas-update.yml' # see push paths note (OTA-PATHS.1)

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Web/mobile parity
        run: npm run check:mobile-parity

      # Catches the class of bug where a mobile file imports a name the target
      # module doesn't export (resolves to `undefined` → crashes at runtime,
      # invisible to vitest/eslint/expo-export). See the 2026-06 schedule crash.
      - name: Mobile import resolution
        run: npm run check:mobile-imports

      # MOBILE-LINT.1 — until this step existed NO linter ran against mobile/**
      # at all: the root eslint.config.mjs ignores it, deferring to `expo lint`,
      # which has never worked here (mobile/package.json carries no eslint
      # dependency, so it dies with "Cannot find module 'eslint'"). `npm run
      # lint` therefore reported clean on mobile-only changes — three of them
      # shipped that way, each needing a throwaway manual no-unused-vars /
      # no-undef pass. Its very first run caught a live crash: expenses/[id].jsx
      # still called setOcrState/setOcrConfidence/setOcrError after
      # INVOICES-QUEUE.1 PR 3 deleted them. See eslint.mobile.config.mjs.
      - name: Mobile lint
        run: npm run check:mobile-lint

      # Catches the #408 class of bug — an /api route shipping with NO auth
      # guard at all (middleware only proves a valid JWT exists; champ-app
      # customers hold valid JWTs on the same Supabase project). Audit
      # follow-up (2026-06-10): every non-public route must resolve +
      # authorize the caller itself. See scripts/check-route-guards.mjs.
      - name: Route guard presence
        run: npm run check:route-guards

      # Catches the SAAS-1..5 class of bug — an authenticated route querying
      # a location_id-bearing table with NO tenant scoping (service role
      # bypasses RLS, so an unscoped .from('contacts') serves any tenant's
      # rows). The tenant-table set is derived from supabase/migrations at
      # runtime. See scripts/check-location-scoping.mjs.
      - name: Location scoping presence
        run: npm run check:location-scoping

      # Catches the RLS-RESTRICTIVE.1 class — a restrictive `FOR ALL ...
      # USING (false)` deny-writes policy that also folds away the table's
      # permissive SELECT (FOR ALL includes SELECT). The read returns an
      # EMPTY SET rather than an error, and realtime subscribers silently
      # never fire. Reached 16 tables before anything noticed. Derived from
      # the net policy state in supabase/migrations. See migration 485 and
      # scripts/check-rls-restrictive.mjs.
      - name: RLS restrictive-policy sanity
        run: npm run check:rls-restrictive

      # Catches the audit's recurring silent-data-loss classes — a .catch on a
      # supabase thenable (throws, query never runs) and a .limit(>=1000) without
      # .range() (PostgREST silently caps at 1000 rows). ERROR-level custom ESLint
      # rules in a scoped config. See eslint.guardrails.config.mjs.
      - name: Supabase guardrails
        run: npm run check:guardrails

      # Phase 0b of the Repset merge — the staff + member mobile apps are
      # merging into ONE binary, after which staff-app JS ships to every
      # member phone. Nothing secret-shaped may live in mobile/** or
      # shared/**: PEM blocks, key files, Stripe/AWS/GitHub keys, Supabase
      # SERVICE-ROLE JWTs (the anon key is intentionally committed and is
      # not flagged), and hardcoded gate codes (the burned review-login
      # precedent). See scripts/check-secrets.mjs.
      - name: Secret scan (mobile/shared)
        run: npm run check:secrets

      # TENANT.8 — catches shared/permission-bundles.js's KEY_BUNDLES
      # drifting from the seed data pasted into the latest migration
      # that reseeds private.permission_key_bundles (the SQL mirror
      # private.auth_mobile_can reads for mobile RLS). See mig 550 and
      # scripts/check-bundle-sql.mjs.
      - name: Bundle SQL drift
        run: npm run check:bundle-sql

      # OTA-PATHS.1 — eas-update.yml's trigger is an ALLOWLIST of paths
      # that genuinely enter the Metro bundle, so a new non-bundle file
      # under mobile/ is inert instead of publishing a no-op OTA to
      # production phones. This is the other half of that bargain: it
      # fails the moment a new top-level entry under mobile/ is neither
      # in the trigger nor declared non-bundle, so an allowlist miss is
      # caught on the PR that creates the directory rather than as a
      # silently-missing update days later.
      - name: OTA trigger paths
        run: npm run check:ota-paths

  # SAAS4-W0.3 (INFRA_BACKLOG #7) — `next build` as a first-class CI gate.
  # Vitest runs on mocked imports, so a missing/renamed export or an
  # unresolvable import sails through tests + eslint and only fails in
  # Vercel's Turbopack build ("green CI, red Vercel"). Runs as a parallel
  # job so it doesn't lengthen the test/lint feedback loop. The build
  # needs no env secrets — env reads (getAppUrl etc.) throw at request
  # time, not build time; all pages are dynamic.
  build:
    name: Next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Persist Next's incremental compilation cache between runs —
      # keyed on the lockfile (dependency graph) with a source-hash
      # refinement so the newest compatible cache restores on any
      # source change.
      - name: Restore Next build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-build-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'shared/**') }}
          restore-keys: |
            next-build-${{ hashFiles('package-lock.json') }}-

      - name: Next build
        run: npm run build
