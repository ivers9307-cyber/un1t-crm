<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CF Studio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader {
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <!--
    STUDIO-MAC.1 — bootstrap page.

    Tauri 2 requires a `frontendDist` path even when the actual
    "app" is an external URL. This file is that placeholder: it
    immediately replaces itself with the prod CRM, so the user
    never sees more than a black flash on cold start.

    The hard navigation (location.replace) is preferred over a
    redirect meta tag because it doesn't leave a history entry —
    the user can't accidentally back-button their way out of the
    web CRM into this loader.

    The prod URL is also the default tauri.conf.json window URL, so
    either entry point lands in the same place. This file is the
    fallback for "user launched from the bundle, no deep link".
  -->
  <div class="loader">Loading…</div>
  <script>
    (function () {
      var target = 'https://crm.un1tdublin.com'
      // Allow override at build time for staging by injecting a
      // <meta name="cf-studio-base"> tag (CI step can swap it).
      var meta = document.querySelector('meta[name="cf-studio-base"]')
      if (meta && meta.content) target = meta.content
      window.location.replace(target)
    })()
  </script>
</body>
</html>
