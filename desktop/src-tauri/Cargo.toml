[package]
name = "repset"
version = "1.0.0"
description = "Repset Mac shell — Tauri wrapper for crm.repset.ie"
authors = ["UN1T Dublin"]
edition = "2021"
rust-version = "1.77"

# STUDIO-MAC.1 — Tauri 2 shell. The whole crate is roughly 50 lines of
# Rust glue around the WebView + a single plugin. The "app" is the
# web CRM; this binary just provides the native window + dock.
#
# STUDIO-MAC.5 — no [lib] block. The Tauri 2 init template scaffolds
# one (so the project can also target iOS/Android where the entry
# point differs), but for a Mac-only desktop we just need src/main.rs
# and the implicit binary target Cargo derives from it. Declaring
# `[lib] name = "repset_lib"` without a matching `src/lib.rs`
# breaks `cargo metadata` before any code compiles — which was why
# every desktop-build CI run silently failed in 16 seconds.
#
# STUDIO-MAC.8 — autostart + updater plugins removed for Mac App
# Store distribution. App Store sandbox forbids launch-agent
# registration (autostart) and App Store policy forbids
# self-updating apps (the App Store handles updates itself). If
# non-App-Store distribution ever comes back as a fallback, the
# plugins return; until then git history is the reference.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
